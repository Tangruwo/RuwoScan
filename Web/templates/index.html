<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RuwoScan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">⚔</div>
            <div class="title">RuwoScan</div>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            实时
            <span style="color:#4a5a6a;margin-left:4px;" id="logCount">0</span>
        </div>
    </div>
    <div class="log-container" id="logContainer">
        <div class="empty-state"><div class="icon">🜁</div><div>王座空悬 · 等待第一条指令</div></div>
    </div>
    <div class="footer">
        <div class="input-wrap">
            <input type="text" id="cmdInput" placeholder="输入指令..." autocomplete="off" />
            <button class="send-btn" id="sendBtn">发送</button>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
